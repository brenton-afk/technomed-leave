<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Calendar</title>
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --ink: #1d232b; --muted: #6b7380; --line: #e4e2dc;
      --brand: #1f3a5f; --accent: #2f7de1; --warn-bg: #fff4e0; --warn-ink: #8a5300;
      --today: #eaf2fd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121418; --card: #1c1f25; --ink: #eceef1; --muted: #9aa3ae; --line: #2c3038;
        --brand: #9cc1f0; --accent: #6aa8f5; --warn-bg: #3a2c12; --warn-ink: #f3c77a;
        --today: #1d2a3d;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%; }
    button { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    /* sign in */
    .login { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .login form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px; }
    .login h1 { margin: 0 0 4px; font-size: 24px; color: var(--brand); }
    .login p { margin: 0 0 20px; color: var(--muted); }
    .login label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
    .login input { width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
    .login button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; font-size: 17px; }
    @media (prefers-color-scheme: dark) { .login button { color: #10161f; } }
    .error { color: #c0392b; font-size: 14px; margin-top: 12px; min-height: 1em; }

    /* app */
    header { position: sticky; top: 0; z-index: 5; background: var(--bg);
      padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; border-bottom: 1px solid var(--line); }
    .top { display: flex; align-items: center; gap: 10px; }
    .top h1 { margin: 0; font-size: 22px; color: var(--brand); flex: 1; }
    .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
    .icon-btn svg { width: 18px; height: 18px; }
    .spin svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14px; cursor: pointer; }
    .chip .dot { width: 10px; height: 10px; border-radius: 50%; }
    .chip.off { opacity: 0.45; }
    .chip.off .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
    .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-top: 10px; }
    .tabs button { flex: 1; border: 0; background: none; padding: 7px; border-radius: 8px; font-size: 15px; cursor: pointer; color: var(--muted); }
    .tabs button[aria-selected="true"] { background: var(--brand); color: #fff; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .tabs button[aria-selected="true"] { color: #10161f; } }

    main { padding: 8px 16px calc(env(safe-area-inset-bottom) + 32px); max-width: 720px; margin: 0 auto; }
    .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }

    .day { margin-top: 18px; }
    .day h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
    .day h2 .rel { color: var(--accent); }
    .ev { width: 100%; text-align: left; display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .ev .bars { display: flex; gap: 2px; align-self: stretch; }
    .ev .bars span { width: 4px; border-radius: 2px; }
    .ev .time { width: 62px; flex: none; font-size: 14px; font-variant-numeric: tabular-nums; }
    .ev .time small { display: block; color: var(--muted); }
    .ev .body { flex: 1; min-width: 0; }
    .ev .title { font-weight: 600; }
    .ev .meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
    .more { display: block; margin: 16px auto; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }

    /* month */
    .mhead { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
    .mhead h2 { margin: 0; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .grid .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
    .cell { aspect-ratio: 1 / 1.05; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; }
    .cell.out { opacity: 0.4; }
    .cell.today { background: var(--today); border-color: var(--accent); }
    .cell.sel { outline: 2px solid var(--brand); outline-offset: -1px; }
    .cell .n { font-size: 14px; font-variant-numeric: tabular-nums; }
    .cell .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: auto; }
    .cell .dots span { width: 6px; height: 6px; border-radius: 50%; }

    /* detail sheet */
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: 100%; max-width: 560px; background: var(--card); border-radius: 18px 18px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom) + 24px); max-height: 85vh; overflow-y: auto; }
    .sheet h3 { margin: 0 0 6px; font-size: 21px; }
    .sheet .row { margin-top: 12px; }
    .sheet .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .sheet a { color: var(--accent); }
    .sheet .notes { white-space: pre-wrap; overflow-wrap: anywhere; }
    .who { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
    .who .dot { width: 10px; height: 10px; border-radius: 50%; }
    .close { margin-top: 20px; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
    .signout { display: block; margin: 28px auto 0; background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <section id="login" class="login hidden">
    <form id="login-form" autocomplete="on">
      <h1>Family Calendar</h1>
      <p>Everyone’s calendars, in one place.</p>
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="given-name" placeholder="e.g. Kate">
      <label for="passcode">Family passcode</label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Sign in</button>
      <div class="error" id="login-error" role="alert"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <header>
      <div class="top">
        <h1 id="greeting">Family Calendar</h1>
        <button class="icon-btn" id="refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
      <div class="sub" id="updated">Loading…</div>
      <div class="chips" id="chips"></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-list" aria-selected="true">Upcoming</button>
        <button role="tab" id="tab-month" aria-selected="false">Month</button>
      </div>
    </header>
    <main>
      <div id="banners"></div>
      <div id="view"></div>
      <button class="signout" id="signout">Sign out</button>
    </main>
  </section>

  <div id="sheet" class="sheet-bg hidden" role="dialog" aria-modal="true"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
