<!DOCTYPE html>
<html lang="en" style="background:#042746">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers. Without it they are all zero, so every bit of safe-area
         handling in the app silently does nothing and headers sit under the
         clock on a notched iPhone.
         maximum-scale=1 (Brent, 6 Nov 2026: "the page not holding size so you
         have to zoom out with your fingers"): the page stays 1:1. Pinch is
         blocked in src/lockZoom.js everywhere except [data-zoomable] — the
         scanner's "Check the detail", where reading a sticker needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#042746" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TechnoMed" />
    <meta name="description" content="TechnoMed Staff Portal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>TechnoMed — Staff Portal</title>
  </head>
  <body>
    <!-- What shows while the app is arriving. Inside #root, so React replaces it
         the moment the app draws. On a weak signal — the Calvary corridor,
         theatre 6 — the app could take most of a minute, and this used to be a
         blank navy screen with no sign anything was happening or what to do. -->
    <div id="root">
      <div id="tm-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;
        text-align:center;padding:24px;box-sizing:border-box;color:#fff;
        font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
        <div>
          <div style="font-weight:700;font-size:18px">TechnoMed</div>
          <div id="tm-boot-slow" style="display:none;margin-top:12px;opacity:.9">
            <p style="margin:0 0 16px">Still loading — the signal here may be weak.</p>
            <button onclick="location.reload()" style="font:inherit;font-weight:700;padding:12px 28px;
              border:0;border-radius:10px;background:#189a85;color:#fff">Try again</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var slow = document.getElementById('tm-boot-slow')
        if (slow) slow.style.display = 'block'
      }, 8000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
